<text x="128" y="635.4" font-family="Inter" font-size="10.5" font-weight="600" fill="#8C877F" text-anchor="middle">Personal Banking Customer</text>
<text x="128" y="650.2" font-family="Inter" font-size="9" font-weight="400" fill="#C0BBB2" text-anchor="middle">A customer of the bank, with</text>
<text x="128" y="660.55" font-family="Inter" font-size="9" font-weight="400" fill="#C0BBB2" text-anchor="middle">personal bank accounts.</text>
<text x="128" y="680" font-family="Inter" font-size="9" font-weight="500" fill="#56524C" text-anchor="middle">Person</text>
<text x="295.81" y="430.11" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Visits bigbank.com/ib using</text>
<text x="329.26" y="501.43" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Views account balances, and makes payments using</text>
<text x="378.31" y="483.88" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Views account balances, and makes payments using</text>
<text x="409.76" y="757.48" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Sends e-mails to</text>
<text x="413" y="815" font-family="Inter" font-size="11" font-weight="600" fill="#8C877F" text-anchor="start" fill-opacity="0.8">Big Bank plc</text>
<text x="497.19" y="683.43" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Makes API calls to</text>
<text x="498" y="166.5" font-family="Inter" font-size="10" font-weight="700" fill="#E7E6E2" text-anchor="middle">A</text>
<text x="498" y="189.4" font-family="Inter" font-size="13" font-weight="600" fill="#1E1D1B" text-anchor="middle">Web Application</text>
<text x="498" y="202.2" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">Delivers the static content and</text>
<text x="498" y="212.55" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">the Internet banking single pag…</text>
<text x="498" y="232" font-family="Inter" font-size="9" font-weight="500" fill="#56524C" text-anchor="middle">App</text>
<text x="509.96" y="275.15" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Delivers to the customer's web browser</text>
<text x="511" y="866.5" font-family="Inter" font-size="10" font-weight="700" fill="#E7E6E2" text-anchor="middle">S</text>
<text x="511" y="887.4" font-family="Inter" font-size="10.5" font-weight="600" fill="#8C877F" text-anchor="middle">Mainframe Banking System</text>
<text x="511" y="902.2" font-family="Inter" font-size="9" font-weight="400" fill="#C0BBB2" text-anchor="middle">Stores all of the core banking</text>
<text x="511" y="912.55" font-family="Inter" font-size="9" font-weight="400" fill="#C0BBB2" text-anchor="middle">information about customers,…</text>
<text x="511" y="932" font-family="Inter" font-size="9" font-weight="500" fill="#56524C" text-anchor="middle">System</text>
<text x="525" y="306.5" font-family="Inter" font-size="10" font-weight="700" fill="#E7E6E2" text-anchor="middle">A</text>
<text x="525" y="328.6" font-family="Inter" font-size="12" font-weight="600" fill="#1E1D1B" text-anchor="middle">Single-Page Application</text>
<text x="525" y="342.2" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">Provides all of the Internet</text>
<text x="525" y="352.55" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">banking functionality to…</text>
<text x="525" y="372" font-family="Inter" font-size="9" font-weight="500" fill="#56524C" text-anchor="middle">App</text>
<text x="536.4" y="415.14" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Makes API calls to</text>
<text x="544.99" y="717.26" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Sends e-mail using</text>
<text x="551" y="446.5" font-family="Inter" font-size="10" font-weight="700" fill="#E7E6E2" text-anchor="middle">A</text>
<text x="551" y="469.4" font-family="Inter" font-size="13" font-weight="600" fill="#1E1D1B" text-anchor="middle">API Application</text>
<text x="551" y="482.2" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">Provides Internet banking</text>
<text x="551" y="492.55" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">functionality via a JSON/HTTPS…</text>
<text x="551" y="512" font-family="Inter" font-size="9" font-weight="500" fill="#56524C" text-anchor="middle">App</text>
<text x="596.04" y="555.24" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Reads from and writes to</text>
<text x="611.5" y="102.5" font-family="Inter" font-size="10" font-weight="400" fill="#9A958C" text-anchor="middle">System</text>
<text x="611.5" y="123" font-family="Inter" font-size="12" font-weight="400" fill="#8C877F" text-anchor="middle">Allows customers to view information about their bank accounts, and make payments.</text>
<text x="611.5" y="84" font-family="Inter" font-size="14" font-weight="600" fill="#8C877F" text-anchor="middle">Internet Banking System</text>
<text x="637.76" y="391.25" font-family="Inter" font-size="10" font-weight="400" fill="#8C877F" text-anchor="middle">Makes API calls to</text>
<text x="642" y="609.4" font-family="Inter" font-size="13" font-weight="600" fill="#1E1D1B" text-anchor="middle">Database</text>
<text x="642" y="622.2" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">Stores user registration</text>
<text x="642" y="632.55" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">information, hashed…</text>
<text x="642" y="652" font-family="Inter" font-size="9" font-weight="500" fill="#56524C" text-anchor="middle">Data store</text>
<text x="711" y="866.5" font-family="Inter" font-size="10" font-weight="700" fill="#E7E6E2" text-anchor="middle">S</text>
<text x="711" y="889.4" font-family="Inter" font-size="13" font-weight="600" fill="#8C877F" text-anchor="middle">E-mail System</text>
<text x="711" y="902.2" font-family="Inter" font-size="9" font-weight="400" fill="#C0BBB2" text-anchor="middle">The internal Microsoft Exchange</text>
<text x="711" y="912.55" font-family="Inter" font-size="9" font-weight="400" fill="#C0BBB2" text-anchor="middle">e-mail system.</text>
<text x="711" y="932" font-family="Inter" font-size="9" font-weight="500" fill="#56524C" text-anchor="middle">System</text>
<text x="725" y="306.5" font-family="Inter" font-size="10" font-weight="700" fill="#E7E6E2" text-anchor="middle">A</text>
<text x="725" y="329.4" font-family="Inter" font-size="13" font-weight="600" fill="#1E1D1B" text-anchor="middle">Mobile App</text>
<text x="725" y="342.2" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">Provides a limited subset of the</text>
<text x="725" y="352.55" font-family="Inter" font-size="9" font-weight="400" fill="#9A958C" text-anchor="middle">Internet banking functionality to…</text>
<text x="725" y="372" font-family="Inter" font-size="9" font-weight="500" fill="#56524C" text-anchor="middle">App</text>
