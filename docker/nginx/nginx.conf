map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# cloudflared supplies the public scheme and client address. The fallbacks keep
# the image usable when it is reached directly during local development.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

map $http_cf_connecting_ip $forwarded_client_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The editor is deliberately separate from the public marketing site and
    # must never compete with maplespire.ca in search results. Keep it
    # crawlable so search engines can read the noindex directive.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Microsoft Entra fetches this exact JSON resource when verifying the
    # app registration's publisher domain. OFF by default: the file exists only
    # when MS_IDENTITY_ASSOCIATION_APP_ID is set (40-microsoft-identity-association.sh).
    # Never let the SPA fallback turn a missing verification file into an HTML
    # 200 response.
    location = /.well-known/microsoft-identity-association.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # GC quarantine is internal state on the shared volume, never a public asset.
    location ^~ /assets/technologies/.gc/ {
        return 404;
    }

    location ^~ /assets/technologies/ {
        alias /var/lib/maplespire/assets/technologies/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'" always;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    location /icons/ {
        alias /usr/share/nginx/html/icons/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # The pool census is an in-process diagnostic, unauthenticated ON PURPOSE so
    # an operator can read it when the primary pool has no connection left to
    # answer with. It is meant to be read from the cell itself, never publicly;
    # under the `/api/` prefix below it would be public, while `/metrics` is
    # protected TWICE: by `METRICS_TOKEN` and by having no `location` here.
    #
    # Left public it is a per-second database query rate for four pools
    # (`acquires` is cumulative), live saturation, and a working oracle telling
    # an unauthenticated caller whether their load is landing. An exact-match
    # `location` outranks the `/api/` prefix, which is what keeps it private.
    location = /api/health/pools {
        return 404;
    }

    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Streamable HTTP MCP must reach the backend for POST/GET/DELETE requests;
    # otherwise the SPA fallback serves index.html and nginx rejects POST with
    # 405 before the MCP server can authenticate the agent.
    location = /mcp {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }

    # OAuth-capable MCP clients discover these metadata documents outside the
    # /api namespace. Registration, token and consent already use /api.
    location ^~ /.well-known/oauth- {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # THE ONLY LOCATION THAT GOES TO THE OWNER-AWARE ROUTER, and
    # it must never be routed to a cell chosen by anything else. The router
    # resolves the partition owner in Redis and tunnels directly to that cell;
    # sending the upgrade to an arbitrary cell instead makes a paused
    # intermediary stall unrelated healthy partitions.
    #
    # The image provides independent BACKEND_* and SYNC_WS_* defaults.
    # A deployment without a router must explicitly set both pairs to its
    # single API endpoint when overriding those defaults.
    location = /automerge {
        proxy_pass http://${SYNC_WS_HOST}:${SYNC_WS_PORT}/automerge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
