name: DCO

# Fails a pull request when one of its commits lacks a `Signed-off-by:` trailer
# matching the commit author (https://developercertificate.org/). Merge commits
# and bot commits are exempt. Mark this check as required in branch protection.

on:
  pull_request:

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author_email=$(git log -1 --format='%ae' "$sha")
            author_name=$(git log -1 --format='%an' "$sha")
            case "$author_email" in
              *'[bot]@users.noreply.github.com') continue ;;
            esac
            if ! git log -1 --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>[[:space:]]*$"; then
              echo "::error::Commit $sha ($author_name <$author_email>) has no Signed-off-by line"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign your commits with 'git commit -s' (see CONTRIBUTING.md#developer-certificate-of-origin-dco)."
            exit 1
          fi
