<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">MapleSpire — Architecture clarity that moves teams forward</title>
  <desc id="description">A minimalist MapleSpire social card with the geometric tree mark and a connected architecture diagram.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2C33"/>
      <stop offset="1" stop-color="#1D1E23"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24262D" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#9699A2"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#F1EFEB"/>
  <ellipse cx="87" cy="85" rx="258" ry="220" fill="#7E8AA3" opacity=".34"/>
  <ellipse cx="1112" cy="188" rx="260" ry="245" fill="#B98570" opacity=".32"/>
  <ellipse cx="427" cy="682" rx="330" ry="213" fill="#CFAF98" opacity=".28"/>

  <g transform="translate(70 47) scale(.34)">
    <g fill="#B98570">
      <path d="M123 64h10v70h-10z"/>
      <path d="m83 93 9-5 40 78-9 5z"/>
    </g>
    <path fill="#8F5C48" d="m164 88 9 5-40 78-9-5z"/>
    <g fill="#24262D">
      <path d="M123 134h10v62h-10z"/>
      <path d="m78 132 8-8 47 47-8 8z"/>
      <path d="m170 124 8 8-47 47-8-8z"/>
    </g>
  </g>
  <text x="139" y="101" fill="#24262D" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-.7">MapleSpire</text>

  <text x="70" y="235" fill="#24262D" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.7">
    <tspan x="70" dy="0">Architecture clarity</tspan>
    <tspan x="70" dy="54">that moves teams forward</tspan>
  </text>
  <text x="73" y="349" fill="#5D5A57" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="400">
    <tspan x="73" dy="0">Collaborative diagramming and modelling for</tspan>
    <tspan x="73" dy="34">a single, trusted source of truth.</tspan>
  </text>

  <g transform="translate(640 117)" filter="url(#shadow)">
    <rect width="500" height="402" rx="28" fill="url(#canvas)"/>
    <rect x="24" y="24" width="452" height="354" rx="18" fill="#24262D" stroke="#50535E" stroke-width="1"/>
    <text x="48" y="58" fill="#B8BAC2" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.35">SYSTEM CONTEXT &#183; MAPLESPIRE</text>
    <text x="452" y="58" text-anchor="end" fill="#747781" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.1">C4 &#183; LEVEL 1</text>
    <path d="M48 78H452" stroke="#444751" stroke-width="1"/>

    <g fill="none" stroke="#9699A2" stroke-width="2">
      <path d="M123 188C123 216 177 208 213 238" marker-end="url(#arrow)"/>
      <path id="auth-relation" d="M287 238C323 208 345 216 377 188"/>
    </g>
    <path id="auth-arrowhead" d="M377 188L372.7 199.8L364.8 190.7Z" fill="#9699A2"/>
    <g font-family="Inter, Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing=".35">
      <rect x="94" y="201" width="106" height="19" rx="9.5" fill="#24262D"/>
      <text x="147" y="214" text-anchor="middle" fill="#9699A2">MODELS &amp; REVIEWS</text>
      <rect x="300" y="201" width="106" height="19" rx="9.5" fill="#24262D"/>
      <text x="353" y="214" text-anchor="middle" fill="#9699A2">AUTHENTICATES VIA</text>
    </g>

    <g>
      <rect x="48" y="108" width="150" height="80" rx="12" fill="#F1EFEB"/>
      <path d="M61 124V172" stroke="#B98570" stroke-width="5" stroke-linecap="round"/>
      <text x="78" y="141" fill="#24262D" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700">Architecture team</text>
      <text x="78" y="162" fill="#77736F" font-family="Inter, Arial, sans-serif" font-size="9">Person</text>
    </g>
    <g>
      <rect x="175" y="238" width="150" height="96" rx="12" fill="#DCE0E8"/>
      <path d="M188 254V318" stroke="#7E8AA3" stroke-width="5" stroke-linecap="round"/>
      <text x="205" y="274" fill="#24262D" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">MapleSpire</text>
      <text x="205" y="295" fill="#656871" font-family="Inter, Arial, sans-serif" font-size="9">Software system</text>
      <text x="205" y="313" fill="#656871" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing=".45">IN SCOPE</text>
    </g>
    <g>
      <rect x="302" y="108" width="150" height="80" rx="12" fill="#E4C9BE"/>
      <path d="M315 124V172" stroke="#8F5C48" stroke-width="5" stroke-linecap="round"/>
      <text x="332" y="141" fill="#24262D" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700">Identity provider</text>
      <text x="332" y="162" fill="#745D54" font-family="Inter, Arial, sans-serif" font-size="8.5">External software system</text>
    </g>

    <g font-family="Inter, Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing=".55">
      <rect x="48" y="358" width="8" height="8" rx="2" fill="#F1EFEB"/>
      <text x="63" y="365" fill="#9699A2">PERSON</text>
      <rect x="165" y="358" width="8" height="8" rx="2" fill="#DCE0E8"/>
      <text x="180" y="365" fill="#9699A2">SYSTEM IN SCOPE</text>
      <rect x="324" y="358" width="8" height="8" rx="2" fill="#E4C9BE"/>
      <text x="339" y="365" fill="#9699A2">EXTERNAL SYSTEM</text>
    </g>
  </g>

  <rect x="70" y="487" width="188" height="42" rx="21" fill="#24262D"/>
  <text x="164" y="514" text-anchor="middle" fill="#F1EFEB" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing=".2">maplespire.ca</text>
</svg>
