# Unit tests for the alert rules, evaluated against fixture series.
#
# `promtool check rules` parses an expression. It cannot tell a rule that is
# VALID from one that is valid and MATCHES NOTHING: a rule present, valid,
# listed in the Prometheus UI and inactive forever. This file closes that. The real rule
# engine loads `alerts.yml` and runs it against synthetic series, so an
# assertion here is about what an alert DOES.
#
# Run by `scripts/monitoring.test.mjs` inside `prom/prometheus:v3.1.0`, the same
# image the compose stack deploys, against a control file that must fail.
#
# ## Two format facts, both measured rather than assumed
#
# **`alert_rule_test` compares ANNOTATIONS exactly.** Giving `exp_alerts` means
# copying every description into this file verbatim, so a wording edit breaks a
# test that was never about wording. Positive cases therefore assert on the
# `ALERTS` series through `promql_expr_test` instead — same rule engine, same
# `for:` handling, labels only. `alert_rule_test` is kept only where the
# expectation is EMPTY, which needs no annotations.
#
# **A NaN value cannot be asserted.** promtool compares expected against actual
# with `==`, and `NaN == NaN` is false, so a `value: .nan` expectation fails
# against a NaN result — verified, "exp: … NaN got: … NaN". The NaN claims below
# are therefore asserted through `ALERTS` (whose value is 1) and through the
# ABSENCE of samples, never by pinning the NaN itself.
#
# `rule_files` resolves relative to THIS file, which is why the runner mounts
# the two files into one directory rather than mounting `infra/monitoring`:
# that directory also holds `metrics-token`, and a scrape credential has no
# business inside a throwaway container.

rule_files:
  - alerts.yml

evaluation_interval: 15s

tests:

  - interval: 30s
    name: SMTP zero stays silent and first failure fires without grace then clears on a plateau
    input_series:
      - series: 'alertmanager_notification_requests_failed_total{job="alertmanager", instance="am:9093", integration="email"}'
        values: '0 0 1+0x12'
      - series: 'process_start_time_seconds{job="alertmanager", instance="am:9093"}'
        values: '100+0x14'
      - series: 'up{job="alertmanager", instance="am:9093"}'
        values: '1+0x14'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 0s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 30s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 2m30s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m30s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 6m
        exp_samples: []
  - interval: 30s
    name: SMTP first positive sample fires conservatively then expires
    input_series:
      - series: 'alertmanager_notification_requests_failed_total{job="alertmanager", instance="am:9093", integration="email"}'
        values: '1+0x12'
      - series: 'process_start_time_seconds{job="alertmanager", instance="am:9093"}'
        values: '100+0x12'
      - series: 'up{job="alertmanager", instance="am:9093"}'
        values: '1+0x12'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 0s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 1m30s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 2m30s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 6m
        exp_samples: []
  - interval: 30s
    name: SMTP healthy reset to zero does not invent an error
    input_series:
      - series: 'alertmanager_notification_requests_failed_total{job="alertmanager", instance="am:9093", integration="email"}'
        values: '1+0x6 0+0x12'
      - series: 'process_start_time_seconds{job="alertmanager", instance="am:9093"}'
        values: '100+0x6 200+0x12'
      - series: 'up{job="alertmanager", instance="am:9093"}'
        values: '1+0x19'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m30s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 4m30s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 8m
        exp_samples: []
  - interval: 30s
    name: SMTP positive reset detects first new error below previous counter
    input_series:
      - series: 'alertmanager_notification_requests_failed_total{job="alertmanager", instance="am:9093", integration="email"}'
        values: '9+0x6 1+0x12'
      - series: 'process_start_time_seconds{job="alertmanager", instance="am:9093"}'
        values: '100+0x6 200+0x12'
      - series: 'up{job="alertmanager", instance="am:9093"}'
        values: '1+0x19'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m30s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 4m30s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 6m
        exp_samples: []
  - interval: 30s
    name: SMTP gap without stale and same-value restart detects epoch at the same offset
    input_series:
      - series: 'alertmanager_notification_requests_failed_total{job="alertmanager", instance="am:9093", integration="email"}'
        values: '1+0x6 _ _ _ _ _ 1+0x10'
      - series: 'process_start_time_seconds{job="alertmanager", instance="am:9093"}'
        values: '100+0x6 _ _ _ _ _ 200+0x10'
      - series: 'up{job="alertmanager", instance="am:9093"}'
        values: '1+0x6 0+0x4 1+0x10'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 5m30s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 7m30s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 8m30s
        exp_samples: []
  - interval: 30s
    name: SMTP increase during gap without restart is observed once collection returns
    input_series:
      - series: 'alertmanager_notification_requests_failed_total{job="alertmanager", instance="am:9093", integration="email"}'
        values: '1+0x6 _ _ _ _ _ 2+0x10'
      - series: 'process_start_time_seconds{job="alertmanager", instance="am:9093"}'
        values: '100+0x22'
      - series: 'up{job="alertmanager", instance="am:9093"}'
        values: '1+0x6 0+0x4 1+0x10'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 5m30s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 7m30s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 8m30s
        exp_samples: []
  - interval: 30s
    name: SMTP up guard excludes stale values and another instance scrape
    input_series:
      - series: 'alertmanager_notification_requests_failed_total{job="alertmanager", instance="am:9093", integration="email"}'
        values: '0 1+0x12'
      - series: 'process_start_time_seconds{job="alertmanager", instance="am:9093"}'
        values: '100+0x14'
      - series: 'up{job="alertmanager", instance="am:9093"}'
        values: '0+0x14'
      - series: 'up{job="alertmanager", instance="other:9093"}'
        values: '1+0x14'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 30s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 1m
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m
        exp_samples: []
  - interval: 30s
    name: SMTP later incident fires after closure with stable process epoch
    input_series:
      - series: 'alertmanager_notification_requests_failed_total{job="alertmanager", instance="am:9093", integration="email"}'
        values: '0 1+0x6 2+0x10'
      - series: 'process_start_time_seconds{job="alertmanager", instance="am:9093"}'
        values: '100+0x18'
      - series: 'up{job="alertmanager", instance="am:9093"}'
        values: '1+0x18'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 30s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 5m30s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 6m30s
        exp_samples: []
  - interval: 30s
    name: SMTP missing and non-email integration counters are not SMTP failures
    input_series:
      - series: 'process_start_time_seconds{job="alertmanager", instance="am:9093"}'
        values: '100+0x14'
      - series: 'up{job="alertmanager", instance="am:9093"}'
        values: '1+0x14'
      - series: 'alertmanager_notification_requests_failed_total{job="alertmanager", instance="am:9093", integration="sns"}'
        values: '0+1x14'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 0s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 30s
        exp_samples: []
      - expr: 'count(ALERTS{alertname="AlertmanagerEmailDeliveryFailed", alertstate="firing"})'
        eval_time: 3m
        exp_samples: []
  - interval: 1m
    name: proposer unknown strictly over 900 seconds and recovery without a second delay
    input_series:
      - series: 'up{job="placement-proposer", instance="proposer:9465"}'
        values: '1+0x20'
      - series: 'maplespire_placement_proposer_enabled{job="placement-proposer", instance="proposer:9465"}'
        values: '1+0x20'
      - series: 'maplespire_placement_proposer_signal_unknown{job="placement-proposer", instance="proposer:9465"}'
        values: '1+0x17 0+0x3'
      - series: 'maplespire_placement_proposer_unknown_age_seconds{job="placement-proposer", instance="proposer:9465"}'
        values: '0+60x15 901 902 NaN NaN NaN'
    alert_rule_test:
      - eval_time: 15m
        alertname: PlacementProposerSignalUnknown
        exp_alerts: []
      - eval_time: 18m
        alertname: PlacementProposerSignalUnknown
        exp_alerts: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="PlacementProposerSignalUnknown", alertstate="firing"}'
        eval_time: 16m
        exp_samples:
          - labels: 'ALERTS{alertname="PlacementProposerSignalUnknown", alertstate="firing", job="placement-proposer", instance="proposer:9465", severity="ticket"}'
            value: 1

  - interval: 1m
    name: proposer disabled no-candidate and another instance cannot qualify an unknown alert
    input_series:
      - series: 'up{job="placement-proposer", instance="disabled"}'
        values: '1+0x20'
      - series: 'maplespire_placement_proposer_enabled{job="placement-proposer", instance="disabled"}'
        values: '0+0x20'
      - series: 'maplespire_placement_proposer_signal_unknown{job="placement-proposer", instance="disabled"}'
        values: '1+0x20'
      - series: 'maplespire_placement_proposer_unknown_age_seconds{job="placement-proposer", instance="disabled"}'
        values: '9999+0x20'
      - series: 'up{job="placement-proposer", instance="no-candidate"}'
        values: '1+0x20'
      - series: 'maplespire_placement_proposer_enabled{job="placement-proposer", instance="no-candidate"}'
        values: '1+0x20'
      - series: 'maplespire_placement_proposer_signal_unknown{job="placement-proposer", instance="no-candidate"}'
        values: '0+0x20'
      - series: 'maplespire_placement_proposer_unknown_age_seconds{job="placement-proposer", instance="no-candidate"}'
        values: '9999+0x20'
      - series: 'up{job="placement-proposer", instance="no-signal-metric"}'
        values: '1+0x20'
      - series: 'maplespire_placement_proposer_enabled{job="placement-proposer", instance="no-signal-metric"}'
        values: '1+0x20'
      - series: 'maplespire_placement_proposer_unknown_age_seconds{job="placement-proposer", instance="no-signal-metric"}'
        values: '9999+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: PlacementProposerSignalUnknown
        exp_alerts: []

  - interval: 1m
    name: configured proposer target down differs from disabled and recovers
    input_series:
      - series: 'up{job="placement-proposer", instance="proposer:9465"}'
        values: '0+0x3 1+0x3'
    alert_rule_test:
      - eval_time: 1m
        alertname: PlacementProposerDown
        exp_alerts: []
      - eval_time: 4m
        alertname: PlacementProposerDown
        exp_alerts: []
      - eval_time: 2m
        alertname: PlacementProposerSignalUnknown
        exp_alerts: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="PlacementProposerDown", alertstate="firing"}'
        eval_time: 2m
        exp_samples:
          - labels: 'ALERTS{alertname="PlacementProposerDown", alertstate="firing", job="placement-proposer", instance="proposer:9465", severity="ticket"}'
            value: 1

  - interval: 1m
    name: successful scrape missing one proposer health metric is not healthy or disabled
    input_series:
      - series: 'up{job="placement-proposer", instance="proposer:9465"}'
        values: '1+0x6'
      - series: 'maplespire_placement_proposer_enabled{job="placement-proposer", instance="proposer:9465"}'
        values: '1+0x6'
      - series: 'maplespire_placement_proposer_unknown_age_seconds{job="placement-proposer", instance="proposer:9465"}'
        values: 'NaN+0x6'
      - series: 'maplespire_placement_proposer_signal_unknown{job="placement-proposer", instance="proposer:9465"}'
        values: '_ _ _ _ 0+0x2'
    alert_rule_test:
      - eval_time: 1m
        alertname: PlacementProposerMetricsMissing
        exp_alerts: []
      - eval_time: 4m
        alertname: PlacementProposerMetricsMissing
        exp_alerts: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="PlacementProposerMetricsMissing", alertstate="firing"}'
        eval_time: 2m
        exp_samples:
          - labels: 'ALERTS{alertname="PlacementProposerMetricsMissing", alertstate="firing", job="placement-proposer", instance="proposer:9465", severity="ticket"}'
            value: 1

  - interval: 1m
    name: unconfigured optional proposer emits no alert and supplies no disabled evidence
    alert_rule_test:
      - eval_time: 30m
        alertname: PlacementProposerSignalUnknown
        exp_alerts: []
      - eval_time: 30m
        alertname: PlacementProposerDown
        exp_alerts: []
      - eval_time: 30m
        alertname: PlacementProposerMetricsMissing
        exp_alerts: []

  - interval: 1m
    name: cell coverage pages per instance without borrowing another cell or alerting on a standby
    input_series:
      - series: 'maplespire_sync_cell_owned_workspaces{job="maplespire-api", instance="api-a:3001", cell_id="cell-a"}'
        values: '0+0x4 2+0x10'
      - series: 'maplespire_sync_cell_expected_workspaces{job="maplespire-api", instance="api-a:3001", cell_id="cell-a"}'
        values: '2+0x15'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-a:3001"}'
        values: '1+0x30'
      - series: 'maplespire_sync_cell_owned_workspaces{job="maplespire-api", instance="api-b:3001", cell_id="cell-b"}'
        values: '7+0x15'
      - series: 'maplespire_sync_cell_expected_workspaces{job="maplespire-api", instance="api-b:3001", cell_id="cell-b"}'
        values: '2+0x15'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-b:3001"}'
        values: '1+0x30'
      - series: 'maplespire_sync_cell_owned_workspaces{job="maplespire-api", instance="api-off:3001", cell_id="cell-off"}'
        values: '0+0x15'
      - series: 'maplespire_sync_cell_expected_workspaces{job="maplespire-api", instance="api-off:3001", cell_id="cell-off"}'
        values: '2+0x15'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-off:3001"}'
        values: '0+0x30'
      - series: 'maplespire_sync_cell_owned_workspaces{job="maplespire-api", instance="api-standby:3001", cell_id="cell-standby"}'
        values: '0+0x15'
      - series: 'maplespire_sync_cell_expected_workspaces{job="maplespire-api", instance="api-standby:3001", cell_id="cell-standby"}'
        values: '0+0x15'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-standby:3001"}'
        values: '1+0x30'
      - series: 'maplespire_sync_cell_owned_workspaces{job="maplespire-api", instance="api-unknown:3001", cell_id="cell-unknown"}'
        values: 'NaN+0x15'
      - series: 'maplespire_sync_cell_expected_workspaces{job="maplespire-api", instance="api-unknown:3001", cell_id="cell-unknown"}'
        values: '2+0x15'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-unknown:3001"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: SyncCellCoverageGap
        exp_alerts: []
      - eval_time: 6m
        alertname: SyncCellCoverageGap
        exp_alerts: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="SyncCellCoverageGap", alertstate="firing"}'
        eval_time: 2m
        exp_samples:
          - labels: 'ALERTS{alertname="SyncCellCoverageGap", alertstate="firing", job="maplespire-api", instance="api-a:3001", cell_id="cell-a", severity="page"}'
            value: 1

  - interval: 1m
    name: partition loss warns on a rise and clears when the fifteen minute window expires
    input_series:
      - series: 'maplespire_sync_cell_partition_loss_total{job="maplespire-api", instance="api-a:3001", cell_id="cell-a"}'
        values: '10 11+0x29'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-a:3001"}'
        values: '1+0x30'
      - series: 'maplespire_sync_cell_partition_loss_total{job="maplespire-api", instance="api-b:3001", cell_id="cell-b"}'
        values: '100+0x30'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-b:3001"}'
        values: '1+0x30'
      - series: 'maplespire_sync_cell_partition_loss_total{job="maplespire-api", instance="api-reset:3001", cell_id="cell-reset"}'
        values: '100 100 0+0x28'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-reset:3001"}'
        values: '1+0x30'
      - series: 'maplespire_sync_cell_partition_loss_total{job="maplespire-api", instance="api-off:3001", cell_id="cell-off"}'
        values: '0+1x30'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-off:3001"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: SyncCellPartitionLoss
        exp_alerts: []
      - eval_time: 25m
        alertname: SyncCellPartitionLoss
        exp_alerts: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="SyncCellPartitionLoss", alertstate="firing"}'
        eval_time: 3m
        exp_samples:
          - labels: 'ALERTS{alertname="SyncCellPartitionLoss", alertstate="firing", job="maplespire-api", instance="api-a:3001", cell_id="cell-a", severity="ticket"}'
            value: 1

  - interval: 1m
    name: workspace loss reuses the reason counter without aggregating different cells
    input_series:
      - series: 'maplespire_sync_cell_workspace_losses_by_reason_total{job="maplespire-api", instance="api-a:3001", reason="workspace-moved"}'
        values: '2 3+0x29'
      - series: 'maplespire_sync_cell_workspace_losses_by_reason_total{job="maplespire-api", instance="api-a:3001", reason="partition-unavailable"}'
        values: '5+0x30'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-a:3001"}'
        values: '1+0x30'
      - series: 'maplespire_sync_cell_workspace_losses_by_reason_total{job="maplespire-api", instance="api-b:3001", reason="workspace-moved"}'
        values: '17+0x30'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-b:3001"}'
        values: '1+0x30'
      - series: 'maplespire_sync_cell_workspace_losses_by_reason_total{job="maplespire-api", instance="api-off:3001", reason="workspace-moved"}'
        values: '0+1x30'
      - series: 'maplespire_sync_cell_ownership_enabled{job="maplespire-api", instance="api-off:3001"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: SyncCellWorkspaceLoss
        exp_alerts: []
      - eval_time: 25m
        alertname: SyncCellWorkspaceLoss
        exp_alerts: []
    promql_expr_test:
