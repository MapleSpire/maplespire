# THE EVENT MODEL IS EXPLICIT. This file REPLACES the image's nginx.conf (see
# the compose volume), so a bare `events {}` would leave nginx on its
# compiled-in defaults — one worker and worker_connections 512
# (nginx.org/en/docs/ngx_core_module.html#worker_connections). Each proxied
# WebSocket costs the router TWO sockets, one downstream and one upstream to
# sync-ws-router (nginx.org/en/docs/http/websocket.html), so a load pass at
# 100 users per hot workspace holds 2 x 100 x 2 = 400 of them. MEASURED
# (5 s samples): 103 / 206 / 301 / 410 established router sockets at
# 50 / 100 / 150 / 200 clients — two per client plus the gate's own HTTP calls.
# 4096 is a margin of 8x over the largest steady state, not a measured need
# (whether a failover reconnect overlaps the old sockets is not measured).
# When the cap is hit a client sees an abrupt close (code 1006), which is easy
# to misattribute to owner stalls, so the bench runner prints these three
# directives with every leg, read from THIS file (the compose mount that makes
# the two the same is pinned by the load-soak harness test).
worker_processes 1;
worker_rlimit_nofile 8192;

events {
  worker_connections 4096;
}

http {
  # Docker service IPs change whenever a container is recreated. Resolve them
  # continuously instead of pinning the address found when nginx started.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream sync_cells {
    zone sync_cells 64k;
    # A sync cell can legitimately return 503 while a workspace projector warms
    # or while it is the partition standby. Do not let those application-level
    # responses make nginx quarantine both otherwise-live processes globally.
    server sync-cell-a:3001 resolve max_fails=0;
    server sync-cell-b:3001 resolve max_fails=0;
  }

  upstream owner_aware_ws_router {
    zone owner_aware_ws_router 64k;
    # This stateless tier resolves the Redis partition owner and tunnels
    # directly to it. Never route WebSockets through a random sync cell: a
    # paused intermediary would otherwise stall unrelated healthy partitions.
    server sync-ws-router:3010 resolve max_fails=0;
  }

  server {
    listen 8080;

    location = /automerge {
      proxy_pass http://owner_aware_ws_router/automerge;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 2s;
      proxy_send_timeout 30s;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://sync_cells;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 2s;
      proxy_send_timeout 30s;
      proxy_read_timeout 1h;
      proxy_next_upstream error timeout http_502 http_503;
      # Admit retries for five seconds, for any pool size. This does
      # not interrupt an attempt already waiting under proxy_read_timeout.
      proxy_next_upstream_timeout 5s;
    }
  }
}
